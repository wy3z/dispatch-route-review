name: dispatch-route-review-dev

x-node-service: &node-service
  image: node:24.19.0-bookworm-slim
  working_dir: /app
  environment:
    NEXT_TELEMETRY_DISABLED: "1"
    PNPM_HOME: /pnpm
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - pnpm_store:/app/.pnpm-store

x-operational-ids: &operational-ids
  AUTOTASK_SUPPORT_QUEUE_IDS: ${AUTOTASK_SUPPORT_QUEUE_IDS:-101,102}
  AUTOTASK_INSTALL_QUEUE_IDS: ${AUTOTASK_INSTALL_QUEUE_IDS:-201}
  AUTOTASK_SURVEY_QUEUE_IDS: ${AUTOTASK_SURVEY_QUEUE_IDS:-301}
  AUTOTASK_REQUESTED_STATUS_IDS: ${AUTOTASK_REQUESTED_STATUS_IDS:-401,402}
  AUTOTASK_ACCESS_STATUS_IDS: ${AUTOTASK_ACCESS_STATUS_IDS:-501,502}
  AUTOTASK_THIRD_PARTY_REQUEST_STATUS_IDS: ${AUTOTASK_THIRD_PARTY_REQUEST_STATUS_IDS:-601,602}
  AUTOTASK_READY_TO_BOOK_QUEUE_ID: ${AUTOTASK_READY_TO_BOOK_QUEUE_ID:-101}
  AUTOTASK_READY_TO_BOOK_STATUS_ID: ${AUTOTASK_READY_TO_BOOK_STATUS_ID:-401}

services:
  postgres:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dispatch_route_review
      POSTGRES_USER: dispatch_route_review
      POSTGRES_PASSWORD: dispatch_route_review
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch_route_review -d dispatch_route_review"]
      interval: 5s
      timeout: 3s
      retries: 20

  dependencies:
    <<: *node-service
    restart: "no"
    command: ["sh", "-lc", "corepack enable && pnpm install --frozen-lockfile"]

  migrate:
    <<: *node-service
    restart: "no"
    command: ["sh", "-lc", "corepack enable && pnpm db:migrate"]
    environment:
      DATABASE_URL: postgresql://dispatch_route_review:dispatch_route_review@postgres:5432/dispatch_route_review
      DATABASE_POOL_SIZE: "2"
    depends_on:
      dependencies:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  demo-seed:
    <<: *node-service
    profiles: ["demo"]
    restart: "no"
    command: ["sh", "-lc", "corepack enable && pnpm demo:seed"]
    environment:
      <<: *operational-ids
      DATABASE_URL: postgresql://dispatch_route_review:dispatch_route_review@postgres:5432/dispatch_route_review
      DATABASE_POOL_SIZE: "2"
      DEMO_SEED: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    <<: *node-service
    restart: unless-stopped
    command: ["sh", "-lc", "corepack enable && pnpm dev --hostname 0.0.0.0"]
    environment:
      AUTOTASK_WEB_URL: ${AUTOTASK_WEB_URL:-}
      AUTH_MODE: development
      DEV_USER_EMAIL: developer@localhost
      DEV_USER_NAME: Local developer
      DATABASE_URL: postgresql://dispatch_route_review:dispatch_route_review@postgres:5432/dispatch_route_review
      DATABASE_POOL_SIZE: "10"
      DATABASE_SSL: disable
      OSRM_BASE_URL: https://router.project-osrm.org
      NEXT_TELEMETRY_DISABLED: "1"
      AUTOTASK_READY_TO_BOOK_QUEUE_ID: ${AUTOTASK_READY_TO_BOOK_QUEUE_ID:-101}
      AUTOTASK_READY_TO_BOOK_STATUS_ID: ${AUTOTASK_READY_TO_BOOK_STATUS_ID:-401}
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      demo-seed:
        condition: service_completed_successfully
        required: false

  cache-worker:
    <<: *node-service
    profiles: ["worker"]
    restart: unless-stopped
    command: ["sh", "-lc", "corepack enable && pnpm cache:worker"]
    environment:
      <<: *operational-ids
      DATABASE_URL: postgresql://dispatch_route_review:dispatch_route_review@postgres:5432/dispatch_route_review
      DATABASE_POOL_SIZE: "4"
      CACHE_WORKER: "1"
      AUTOTASK_API_CODE: ${AUTOTASK_API_CODE:-}
      AUTOTASK_USERNAME: ${AUTOTASK_USERNAME:-}
      AUTOTASK_SECRET: ${AUTOTASK_SECRET:-}
      AUTOTASK_BASE_URL: ${AUTOTASK_BASE_URL:-}
      AUTOTASK_THIRD_PARTY_COMPANY_FIELD: ${AUTOTASK_THIRD_PARTY_COMPANY_FIELD:-}
      UK_GEOCODER_URL: ${UK_GEOCODER_URL:-https://api.postcodes.io/postcodes}
      EU_GEOCODER_URL: ${EU_GEOCODER_URL:-https://nominatim.openstreetmap.org/search}
      GEOCODER_ALLOWED_HOSTS: ${GEOCODER_ALLOWED_HOSTS:-api.postcodes.io,nominatim.openstreetmap.org}
      GEOCODER_USER_AGENT_CONTACT: ${GEOCODER_USER_AGENT_CONTACT:-https://example.com/dispatch-route-review}
      CACHE_WARM_PAST_DAYS: "30"
      CACHE_WARM_FUTURE_DAYS: "30"
      CACHE_WORKER_POLL_SECONDS: "10"
      # Keep local refreshes serial to respect Autotask's per-integration
      # thread allowance.
      CACHE_WORKER_BATCH_SIZE: "1"
      CACHE_REFRESH_LEASE_SECONDS: "1800"
    depends_on:
      dependencies:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  node_modules:
  pnpm_store:
  postgres_data:
